<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Smart Attendance AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #4A90E2;
            --primary-dark: #3D7BC4;
            --primary-light: #6FAED9;
            --primary-gradient: linear-gradient(135deg, #4A90E2 0%, #6FAED9 100%);
            --sidebar-blue: #0F2B3D;
            --sidebar-hover: #1A3F57;
            --sidebar-active: #00C9A7;
            --background: #F0F7FF;
            --card-white: #FFFFFF;
            --text-dark: #1A2C3E;
            --text-light: #5A6E7F;
            --border-color: #E9EFF4;
            --success: #28C76F;
            --warning: #FF9F43;
            --danger: #EA5455;
            --info: #00CFE8;
            --ai-purple: #9B59B6;
            --ai-pink: #E91E63;
            --box-shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
            --box-shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
            --border-radius: 20px;
            --card-radius: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            background: var(--background);
            min-height: 100vh;
        }

        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 280px;
            background: linear-gradient(165deg, #071e2c 0%, #0a2a3b 100%);
            color: white;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            box-shadow: 6px 0 25px rgba(0, 0, 0, 0.12);
            z-index: 10;
        }

        .sidebar-header {
            padding: 32px 24px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .logo-icon {
            font-size: 2.4rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .sidebar-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 8px;
            background: linear-gradient(120deg, #FFF, #B8E1FC);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .sidebar-header p {
            font-size: 0.75rem;
            opacity: 0.75;
            margin-top: 6px;
        }
        .sidebar-header p i {
            font-size: 0.7rem;
            color: #00C9A7;
        }

        .sidebar-menu {
            padding: 0 16px;
        }
        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            margin-bottom: 6px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            border-radius: 14px;
            transition: all 0.25s ease;
            font-weight: 500;
            font-size: 0.9rem;
            position: relative;
        }
        .sidebar-menu a i {
            width: 22px;
            font-size: 1.2rem;
        }
        .sidebar-menu a:hover {
            background: rgba(255,255,255,0.08);
            color: white;
            transform: translateX(5px);
        }
        .sidebar-menu a.active {
            background: linear-gradient(95deg, rgba(0, 201, 167, 0.18), rgba(0, 201, 167, 0.08));
            color: #00C9A7;
        }
        .sidebar-menu a.active i {
            color: #00C9A7;
        }
        /* Notification badge on sidebar */
        .sidebar-menu a .notification-count-badge {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--danger);
            color: white;
            border-radius: 30px;
            padding: 2px 8px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .sidebar-footer {
            position: absolute;
            bottom: 20px;
            width: calc(100% - 32px);
            left: 16px;
            padding: 12px 0;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .sidebar-footer a {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 12px 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #FFB5A7;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .sidebar-footer a:hover {
            background: var(--danger);
            color: white;
            transform: translateY(-3px);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 30px 32px;
            overflow-y: auto;
            height: 100vh;
        }

        .content-header {
            margin-bottom: 28px;
        }
        .content-header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1A2C3E, #2D4C6E);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .content-header p {
            color: var(--text-light);
            margin-top: 5px;
        }
        .header-badge {
            background: var(--danger);
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Notifications Container */
        .notifications-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .summary-badge {
            background: white;
            padding: 10px 20px;
            border-radius: 40px;
            box-shadow: var(--box-shadow-sm);
            border: 1px solid var(--border-color);
            display: flex;
            gap: 24px;
        }
        .summary-badge span {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .summary-badge i {
            font-size: 1rem;
        }

        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .filter-tabs {
            display: flex;
            gap: 8px;
        }
        .filter-tab {
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid var(--border-color);
            background: white;
            color: var(--text-dark);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-tab.active {
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
        }
        .mark-read-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 8px 20px;
            border-radius: 40px;
            color: var(--text-light);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .mark-read-btn:hover {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        /* Notifications List */
        .notifications-list {
            background: white;
            border-radius: var(--card-radius);
            box-shadow: var(--box-shadow-sm);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }
        .notification-item {
            display: flex;
            align-items: flex-start;
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-color);
            transition: all 0.2s ease;
            gap: 16px;
            position: relative;
        }
        .notification-item:last-child {
            border-bottom: none;
        }
        .notification-item:hover {
            background: #F9FDFF;
        }
        .notification-item.unread {
            background: linear-gradient(90deg, #F0F7FF, #FFFFFF);
            border-left: 3px solid var(--primary-blue);
        }
        .notification-item.unread::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--primary-blue);
        }

        /* Notification Icons with color coding */
        .notification-icon {
            width: 48px;
            height: 48px;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .notification-icon.ai {
            background: linear-gradient(135deg, #9B59B6, #8E44AD);
            color: white;
        }
        .notification-icon.alert {
            background: #FFE5E5;
            color: var(--danger);
        }
        .notification-icon.success {
            background: #E0F9E8;
            color: var(--success);
        }
        .notification-icon.info {
            background: #E3F2FD;
            color: var(--primary-blue);
        }
        .notification-icon.warning {
            background: #FFF3E0;
            color: var(--warning);
        }
        .notification-icon.face {
            background: linear-gradient(135deg, #00C9A7, #00A88F);
            color: white;
        }

        .notification-content {
            flex: 1;
            min-width: 0;
        }
        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .notification-title {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .notification-title h4 {
            font-size: 1rem;
            color: var(--text-dark);
            font-weight: 700;
        }
        .ai-tag {
            background: linear-gradient(135deg, #9B59B6, #8E44AD);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            color: white;
            font-weight: 600;
        }
        .notification-badge {
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.65rem;
            background: var(--primary-blue);
            color: white;
            font-weight: 600;
        }
        .notification-time {
            font-size: 0.75rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .notification-message {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .confidence-score {
            background: var(--background);
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            display: inline-block;
            margin-top: 5px;
        }
        .notification-actions {
            display: flex;
            gap: 16px;
        }
        .notification-actions a {
            font-size: 0.75rem;
            color: var(--primary-blue);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .notification-actions a:hover {
            text-decoration: underline;
        }

        .load-more {
            text-align: center;
            padding: 16px;
            border-top: 1px solid var(--border-color);
        }
        .load-more button {
            background: none;
            border: none;
            color: var(--primary-blue);
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-state i {
            font-size: 3.5rem;
            opacity: 0.3;
            margin-bottom: 15px;
        }

        .alert {
            padding: 12px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .alert-success {
            background: #E0F9E8;
            color: #1E7B48;
            border-left: 4px solid var(--success);
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 0; }
            .main-content { margin-left: 0; }
            .notification-item { flex-direction: column; align-items: flex-start; }
            .summary-badge { width: 100%; justify-content: space-around; }
            .filter-bar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
<div class="dashboard-container">
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-robot logo-icon"></i>
            <h2>Smart Attendance</h2>
            <p><i class="fas fa-microchip"></i> AI Powered Face Recognition</p>
        </div>
        <div class="sidebar-menu">
            <a href="dashboard.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a href="register.html"><i class="fas fa-user-plus"></i> Registration</a>
            <a href="attendance.html"><i class="fas fa-camera-retro"></i> Attendance</a>
            <a href="reports.html"><i class="fas fa-chart-bar"></i> Reports</a>
            <a href="students.html"><i class="fas fa-users"></i> Students</a>
            <a href="notifications.html" class="active"><i class="fas fa-bell"></i> Notifications</a>
            <a href="settings.html"><i class="fas fa-sliders-h"></i> Settings</a>
        </div>
        <div class="sidebar-footer">
            <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </div>

    <div class="main-content">
        <div class="content-header">
            <h1>
                Notifications 
                <span class="header-badge" id="sidebarBadge">0</span>
            </h1>
            <p>AI-powered alerts and system notifications</p>
        </div>

        <div id="alert-container"></div>

        <div class="notifications-header">
            <div class="summary-badge">
                <span><i class="fas fa-bell" style="color: var(--primary-blue);"></i> Total: <strong id="totalCount">0</strong></span>
                <span><i class="fas fa-envelope" style="color: var(--danger);"></i> Unread: <strong id="unreadCount">0</strong></span>
                <span><i class="fas fa-check-circle" style="color: var(--success);"></i> Read: <strong id="readCount">0</strong></span>
                <span><i class="fas fa-microchip" style="color: #9B59B6;"></i> AI: <strong id="aiCount">0</strong></span>
            </div>
        </div>

        <div class="filter-bar">
            <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all">All</button>
                <button class="filter-tab" data-filter="unread">Unread</button>
                <button class="filter-tab" data-filter="read">Read</button>
                <button class="filter-tab" data-filter="ai">AI Generated</button>
            </div>
            <button class="mark-read-btn" id="markAllRead">
                <i class="fas fa-check-double"></i> Mark All Read
            </button>
        </div>

        <div class="notifications-list" id="notificationsList">
            <!-- Notifications will be dynamically loaded -->
        </div>
    </div>
</div>

<script>
    const API_BASE_URL = 'http://127.0.0.1:5000';
    
    if (!localStorage.getItem('adminToken')) {
        window.location.href = 'index.html';
    }
    
    document.getElementById('logoutBtn').addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('adminToken');
        window.location.href = 'index.html';
    });
    
    function showAlert(message, type) {
        const container = document.getElementById('alert-container');
        const alertDiv = document.createElement('div');
        alertDiv.className = `alert alert-${type}`;
        alertDiv.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'info-circle'}"></i> ${message}`;
        container.appendChild(alertDiv);
        setTimeout(() => alertDiv.remove(), 3000);
    }
    
    let notifications = [];
    let currentFilter = 'all';
    
    // Load read status from localStorage
    function loadReadStatus() {
        const saved = localStorage.getItem('readNotifications');
        if (saved) {
            return JSON.parse(saved);
        }
        return {};
    }
    
    // Save read status to localStorage
    function saveReadStatus(readStatus) {
        localStorage.setItem('readNotifications', JSON.stringify(readStatus));
    }
    
    function getIconForType(iconType) {
        const icons = {
            ai: '<i class="fas fa-microchip"></i>',
            face: '<i class="fas fa-face-smile"></i>',
            alert: '<i class="fas fa-exclamation-triangle"></i>',
            success: '<i class="fas fa-check-circle"></i>',
            info: '<i class="fas fa-info-circle"></i>',
            warning: '<i class="fas fa-clock"></i>'
        };
        return icons[iconType] || '<i class="fas fa-bell"></i>';
    }
    
    async function loadNotifications() {
        try {
            const studentsRes = await fetch(`${API_BASE_URL}/api/students`);
            const studentsData = await studentsRes.json();
            
            const attendanceRes = await fetch(`${API_BASE_URL}/api/attendance`);
            const attendanceData = await attendanceRes.json();
            
            const students = studentsData.students || [];
            const attendance = attendanceData.records || [];
            
            let realNotifications = [];
            const readStatus = loadReadStatus();
            
            // Student registration notifications (last 10)
            students.slice(-10).forEach(student => {
                const notifId = "reg_" + student.student_id;
                realNotifications.push({
                    id: notifId,
                    type: "success",
                    iconType: "success",
                    title: "Student Registered",
                    message: `${student.name} registered successfully`,
                    time: student.created_at ? new Date(student.created_at).toLocaleString() : "recent",
                    status: readStatus[notifId] === true ? 'read' : 'unread',
                    isAI: false,
                    actionLink: "students.html",
                    actionText: "View Student"
                });
            });
            
            // Attendance notifications (last 10)
            attendance.slice(-10).forEach(record => {
                const notifId = "att_" + record.student_id + "_" + record.date;
                realNotifications.push({
                    id: notifId,
                    type: "ai",
                    iconType: "face",
                    title: "Attendance Marked",
                    message: `${record.name} marked present using face recognition`,
                    time: record.date + " " + (record.time || ""),
                    status: readStatus[notifId] === true ? 'read' : 'unread',
                    isAI: true,
                    actionLink: "attendance.html",
                    actionText: "View Attendance"
                });
            });
            
            // Sort by time (newest first) - simple reverse
            notifications = realNotifications.reverse();
            renderNotifications();
        } catch (err) {
            console.log(err);
        }
    }
    
    function renderNotifications() {
        const container = document.getElementById('notificationsList');
        let filtered = notifications;
        
        if (currentFilter === 'unread') {
            filtered = notifications.filter(n => n.status === 'unread');
        } else if (currentFilter === 'read') {
            filtered = notifications.filter(n => n.status === 'read');
        } else if (currentFilter === 'ai') {
            filtered = notifications.filter(n => n.isAI === true);
        }
        
        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-bell-slash"></i>
                    <h4>No notifications</h4>
                    <p>You're all caught up!</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = filtered.map(notif => `
            <div class="notification-item ${notif.status === 'unread' ? 'unread' : ''}" data-id="${notif.id}" data-status="${notif.status}">
                <div class="notification-icon ${notif.iconType}">
                    ${getIconForType(notif.iconType)}
                </div>
                <div class="notification-content">
                    <div class="notification-header">
                        <div class="notification-title">
                            <h4>${escapeHtml(notif.title)}</h4>
                            ${notif.isAI ? '<span class="ai-tag"><i class="fas fa-microchip"></i> AI Generated</span>' : ''}
                            ${notif.status === 'unread' ? '<span class="notification-badge">New</span>' : ''}
                        </div>
                        <span class="notification-time"><i class="far fa-clock"></i> ${notif.time}</span>
                    </div>
                    <p class="notification-message">${escapeHtml(notif.message)}</p>
                    ${notif.confidence ? `<div class="confidence-score"><i class="fas fa-chart-line"></i> Confidence: ${notif.confidence}</div>` : ''}
                    <div class="notification-actions">
                        <a href="${notif.actionLink}"><i class="fas fa-eye"></i> ${notif.actionText}</a>
                        ${notif.status === 'unread' ? `<a href="#" class="mark-single" data-id="${notif.id}"><i class="fas fa-check"></i> Mark Read</a>` : ''}
                    </div>
                </div>
            </div>
        `).join('');
        
        updateCounts();
        attachSingleMarkEvents();
    }
    
    function updateCounts() {
        const total = notifications.length;
        const unread = notifications.filter(n => n.status === 'unread').length;
        const read = total - unread;
        const ai = notifications.filter(n => n.isAI === true).length;
        
        document.getElementById('totalCount').innerText = total;
        document.getElementById('unreadCount').innerText = unread;
        document.getElementById('readCount').innerText = read;
        document.getElementById('aiCount').innerText = ai;
        document.getElementById('sidebarBadge').innerText = unread > 0 ? unread : '';
        
        // Update sidebar badge visibility
        const sidebarBadge = document.querySelector('.sidebar-menu a.active .notification-count-badge');
        if (unread > 0) {
            if (!document.querySelector('.sidebar-menu a.active .notification-count-badge')) {
                const activeLink = document.querySelector('.sidebar-menu a.active');
                const badge = document.createElement('span');
                badge.className = 'notification-count-badge';
                badge.innerText = unread;
                activeLink.appendChild(badge);
            } else {
                document.querySelector('.sidebar-menu a.active .notification-count-badge').innerText = unread;
            }
        } else {
            const badge = document.querySelector('.sidebar-menu a.active .notification-count-badge');
            if (badge) badge.remove();
        }
    }
    
    function attachSingleMarkEvents() {
        document.querySelectorAll('.mark-single').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const id = btn.dataset.id;
                const notification = notifications.find(n => n.id === id);
                if (notification && notification.status === 'unread') {
                    notification.status = 'read';
                    
                    // Save to localStorage
                    const readStatus = loadReadStatus();
                    readStatus[id] = true;
                    saveReadStatus(readStatus);
                    
                    renderNotifications();
                    showAlert('Notification marked as read', 'success');
                }
            });
        });
    }
    
    // Mark all as read
    document.getElementById('markAllRead').addEventListener('click', () => {
        const unreadNotifications = notifications.filter(n => n.status === 'unread');
        const unreadCount = unreadNotifications.length;
        
        if (unreadCount === 0) {
            showAlert('No unread notifications', 'success');
            return;
        }
        
        // Update status and save to localStorage
        const readStatus = loadReadStatus();
        unreadNotifications.forEach(n => {
            n.status = 'read';
            readStatus[n.id] = true;
        });
        saveReadStatus(readStatus);
        
        renderNotifications();
        showAlert(`Marked ${unreadCount} notifications as read`, 'success');
    });
    
    // Filter tabs
    document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            currentFilter = tab.dataset.filter;
            renderNotifications();
        });
    });
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Load notifications on page load and refresh every 10 seconds
    loadNotifications();
    setInterval(loadNotifications, 10000);
</script>
